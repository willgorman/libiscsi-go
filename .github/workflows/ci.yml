name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Build
        uses: flox/activate-action@v2
        with:
          command: go build -v ./...

      - name: Vet
        uses: flox/activate-action@v2
        with:
          command: go vet ./...

      - name: Test
        uses: flox/activate-action@v2
        with:
          command: go test -short -v ./...
